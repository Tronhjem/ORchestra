# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: BuildAndTest

on:
  pull_request:
    branches: [ "main"]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Update submodule
      run: git submodule update --init --recursive
    
    - name: Install clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy
    
    - name: Install dependencies
      run: |
        sudo apt-get install -y \
          libasound2-dev \
          libcurl4-openssl-dev \
          libfreetype6 \
          libfreetype6-dev \
          libfreetype-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxext-dev \
          libxrender-dev \
          mesa-common-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          pkg-config
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -S .
    
    - name: Run clang-tidy
      run: |
        # Find all C++ source files in ORchestra/src directory
        find ORchestra/src -name "*.cpp" -o -name "*.h" | while read file; do
          echo "Checking $file"
          clang-tidy "$file" -p=build || true
        done

  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-14]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-14
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl
          - os: macos-14
            c_compiler: gcc
          - os: macos-14
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Update submodule 
      run: git submodule update --init --recursive

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} -V

    - name: Prepare artifacts (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        mkdir -p artifacts/${{ matrix.os }}
        cp -R ${{steps.strings.outputs.build-output-dir }}/ORchestra/ORchestra_artefacts/Release/ artifacts/${{ matrix.os }}/
    
    - name: Prepare artifacts (Windows)
      if: startsWith(matrix.os, 'windows')
      shell: pwsh
      run: |
        mkdir artifacts\${{ matrix.os }}
        Copy-Item -Path "${{ steps.strings.outputs.build-output-dir }}\ORchestra\ORchestra_artefacts\Release\*" -Destination "artifacts\windows-latest" -Recurse -Force

    - name: Upload artifacts for ${{ matrix.os }}
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}
        path: artifacts/${{ matrix.os }}/*
