# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Build

on:
  pull_request:
    branches: [ "main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-14]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-13
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl
          - os: macos-13
            c_compiler: gcc
          - os: macos-13
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Update submodule 
      run: git submodule update --init --recursive

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake (Plugin Only)
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DBUILD_PLUGIN=ON -DBUILD_TESTS=OFF
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Prepare artifacts (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        mkdir -p artifacts/${{ matrix.os }}
        cp -R ${{steps.strings.outputs.build-output-dir }}/ORchestra/ORchestra_artefacts/Release/AU artifacts/${{ matrix.os }}/AU/
        cp -R ${{steps.strings.outputs.build-output-dir }}/ORchestra/ORchestra_artefacts/Release/VST3 artifacts/${{ matrix.os }}/VST3/
        cp -R ${{steps.strings.outputs.build-output-dir }}/ORchestra/ORchestra_Standalone_artefacts/Release/Standalone artifacts/${{ matrix.os }}/Standalone
    
    - name: Prepare artifacts (Windows)
      if: startsWith(matrix.os, 'windows')
      shell: pwsh
      run: |
        mkdir artifacts\${{ matrix.os }}
        Copy-Item -Path "${{ steps.strings.outputs.build-output-dir }}\ORchestra\ORchestra_artefacts\Release\VST3\*" -Destination "artifacts\windows-latest\VST3" -Recurse -Force
        Copy-Item -Path "${{ steps.strings.outputs.build-output-dir }}\ORchestra\ORchestra_Standalone_artefacts\Release\Standalone\*" -Destination "artifacts\windows-latest\Standlone" -Recurse -Force

    - name: Upload artifacts for ${{ matrix.os }}
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}
        path: artifacts/${{ matrix.os }}/*
