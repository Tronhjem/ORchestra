site_name: ORchestra Documentation
site_url: https://tronhjem.github.io/ORchestra
repo_url: https://github.com/Tronhjem/ORchestra
repo_name: Tronhjem/ORchestra

theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: Installation.md
  - Usage: Usage.md
  - Language Reference: LanguageReference.md
